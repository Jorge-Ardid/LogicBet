name: LogicBet Auto-Sync

on:
  schedule:
    # Runs 4 times a day: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests scipy numpy

      - name: Run Analytics Sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          cd python
          python main.py --force

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add python/logicbet_export.json
          git add godot_app/logicbet.db
          git add data/blackbox_history_backup.json || true
          git add data/api_config.json || true
          git commit -m "Automated data sync: update matches & analytics [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
