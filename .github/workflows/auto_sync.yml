name: LogicBet Auto Sync

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync_and_predict:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          cd python
          pip install -r requirements.txt
          
      - name: Run LogicBet Sync Engine
        env:
          API_KEY_FOOTBALL_DATA_ORG: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_KEY_API_FOOTBALL: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          cd python
          python main.py --force
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/logicbet_export.json
          git add godot_app/logicbet.db
          git diff --staged --quiet || (git commit -m "Auto-update: Sync API data and generate predictions" && git push)
